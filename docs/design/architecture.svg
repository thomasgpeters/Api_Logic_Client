<path d="M 260 340 L 282 340 L 282 774 L 685 774 L 685 748" class="arr2" marker-end="url(#head)" marker-start="url(#tail)"/>
<text x="470" y="768" class="lbl" text-anchor="middle">declare_logic.py: import / export</text>
<path d="M 260 430 L 296 430 L 296 250 L 316 250" class="arr" marker-end="url(#head)"/>
<rect x="850" y="124" width="270" height="640" rx="14" class="panel"/>
<rect x="866" y="140" width="238" height="74" rx="10" class="file"/>
<text x="880" y="164" class="h3" text-anchor="start">Project.json</text>
<text x="880" y="186" class="small" text-anchor="start">name, model source, base URL,</text>
<text x="880" y="204" class="small" text-anchor="start">user name, About text</text>
<rect x="866" y="222" width="238" height="56" rx="10" class="file"/>
<text x="880" y="246" class="h3" text-anchor="start">Design.json</text>
<text x="880" y="268" class="small" text-anchor="start">the designer’s adjustments</text>
<rect x="866" y="286" width="238" height="74" rx="10" class="file"/>
<text x="880" y="310" class="h3" text-anchor="start">Rules.json</text>
<text x="880" y="332" class="small" text-anchor="start">the rules — source of truth</text>
<text x="880" y="350" class="small" text-anchor="start">for the Rules page</text>
<rect x="866" y="368" width="238" height="92" rx="10" class="file"/>
<text x="880" y="392" class="h3" text-anchor="start">Database/&lt;db&gt;.sqlite</text>
<text x="880" y="414" class="small" text-anchor="start">the project’s own copy</text>
<text x="880" y="432" class="small" text-anchor="start">(+ -wal / -shm); backups:</text>
<text x="880" y="450" class="small" text-anchor="start">one folder</text>
<rect x="866" y="466" width="238" height="74" rx="10" class="file"/>
<text x="880" y="490" class="h3" text-anchor="start">FBapp/</text>
<text x="880" y="512" class="small" text-anchor="start">the generated FutureBasic</text>
<text x="880" y="530" class="small" text-anchor="start">project (next column)</text>
<text x="866" y="600" class="small" text-anchor="start">Recent Projects.json lives in</text>
<text x="866" y="618" class="small" text-anchor="start">~/Library/Application Support/</text>
<text x="866" y="636" class="small" text-anchor="start">Api_Logic_Client/</text>
<path d="M 804 236 L 866 175" class="arr" marker-end="url(#head)"/>
<text x="838" y="196" class="lbl" text-anchor="middle">saves</text>
<path d="M 804 250 L 866 245" class="arr" marker-end="url(#head)"/>
<path d="M 804 455 L 866 320" class="arr" marker-end="url(#head)"/>
<path d="M 260 150 L 272 150 L 272 92 L 838 92 L 838 400 L 866 400" class="arr3" marker-end="url(#head)"/>
<text x="640" y="86" class="lbl" text-anchor="middle">the database is copied into the project</text>
<path d="M 804 570 L 866 500" class="arr" marker-end="url(#head)"/>
<rect x="1150" y="124" width="380" height="640" rx="14" class="panel"/>
<text x="1166" y="150" class="h3" text-anchor="start">FBapp/&lt;project&gt;.fbeproj — data.fbproj groups</text>
<rect x="1166" y="164" width="348" height="108" rx="10" class="runtime"/>
<text x="1180" y="188" class="h3" text-anchor="start">Runtime</text>
<text x="1180" y="210" class="small" text-anchor="start">Data SQLite · DataObject query builder (author’s)</text>
<text x="1180" y="228" class="small" text-anchor="start">Data Model · Data Records</text>
<text x="1180" y="246" class="small" text-anchor="start">Logic Rules · Logic Row · Logic Engine</text>
<text x="1180" y="264" class="small" text-anchor="start">ALS Client · ALS Binding · ALS App · Binding Support</text>
<rect x="1166" y="282" width="348" height="72" rx="10" class="gen"/>
<text x="1180" y="306" class="h3" text-anchor="start">Model · Bindings · Resources</text>
<text x="1180" y="328" class="small" text-anchor="start">Model Tags.incl · &lt;Entity&gt; Binding.incl</text>
<text x="1180" y="346" class="small" text-anchor="start">Model.json · &lt;Entity&gt;Form/List.xib · Credits.rtf</text>
<rect x="1166" y="364" width="348" height="72" rx="10" class="gen"/>
<text x="1180" y="388" class="h3" text-anchor="start">Rules</text>
<text x="1180" y="410" class="small" text-anchor="start">Studio Rules.incl (generated: DeclareStudioRules)</text>
<text x="1180" y="428" class="small" text-anchor="start">Rules.incl (yours: DeclareRules, never overwritten)</text>
<rect x="1166" y="446" width="348" height="72" rx="10" class="tmpl"/>
<text x="1180" y="470" class="h3" text-anchor="start">Controller · View · Main</text>
<text x="1180" y="492" class="small" text-anchor="start">EventHandlers.incl · Menus.incl · Windows.incl</text>
<text x="1180" y="510" class="small" text-anchor="start">&lt;project&gt;.main: DataOpen → rules → windows</text>
<rect x="1166" y="534" width="14" height="14" rx="3" class="runtime"/>
<text x="1188" y="546" class="small" text-anchor="start">copied from src/Runtime (regenerated)</text>
<rect x="1166" y="556" width="14" height="14" rx="3" class="gen"/>
<text x="1188" y="568" class="small" text-anchor="start">generated from the model / Rules.json</text>
<rect x="1166" y="578" width="14" height="14" rx="3" class="tmpl"/>
<text x="1188" y="590" class="small" text-anchor="start">starting templates: created once, yours</text>
<path d="M 804 590 L 826 590 L 826 778 L 1136 778 L 1136 300 L 1166 300" class="arr" marker-end="url(#head)"/>
<text x="980" y="772" class="lbl" text-anchor="middle">writes the parts, bindings, project and main</text>
<path d="M 1104 490 L 1166 490" class="arr" marker-end="url(#head)"/>
<rect x="1150" y="790" width="380" height="62" rx="10" class="build"/>
<text x="1164" y="814" class="h3" text-anchor="start">FutureBasic builds it</text>
<text x="1164" y="836" class="small" text-anchor="start">FBtoC → clang, links -lsqlite3 → &lt;project&gt;.app</text>
<rect x="1150" y="868" width="380" height="78" rx="10" class="app"/>
<text x="1164" y="892" class="h3" text-anchor="start">The Mac app</text>
<text x="1164" y="914" class="small" text-anchor="start">XIB windows over the project’s SQLite copy;</text>
<text x="1164" y="932" class="small" text-anchor="start">every save: LogicInsert / LogicUpdate / LogicDelete</text>
<path d="M 1340 764 L 1340 790" class="arr" marker-end="url(#head)"/>
<path d="M 1340 852 L 1340 868" class="arr" marker-end="url(#head)"/>
<path d="M 1104 410 L 1128 410 L 1128 905 L 1150 905" class="arr3" marker-end="url(#head)"/>
<rect x="30" y="790" width="1090" height="156" rx="14" class="panel"/>
<text x="46" y="816" class="h3" text-anchor="start">Rules, end to end</text>
<rect x="46" y="832" width="160" height="58" rx="8" class="step"/>
<text x="126" y="855" class="h4" text-anchor="middle">declare_logic.py</text>
<text x="126" y="874" class="tiny" text-anchor="middle">LogicBank (Python)</text>
<path d="M 206 861 L 224 861" class="arr" marker-end="url(#head)"/>
<rect x="224" y="832" width="160" height="58" rx="8" class="step"/>
<text x="304" y="855" class="h4" text-anchor="middle">rules_bridge import</text>
<text x="304" y="874" class="tiny" text-anchor="middle">lambdas → FB</text>
<path d="M 384 861 L 402 861" class="arr" marker-end="url(#head)"/>
<rect x="402" y="832" width="160" height="58" rx="8" class="step"/>
<text x="482" y="855" class="h4" text-anchor="middle">Rules.json</text>
<text x="482" y="874" class="tiny" text-anchor="middle">edited on the Rules page</text>
<path d="M 562 861 L 580 861" class="arr" marker-end="url(#head)"/>
<rect x="580" y="832" width="160" height="58" rx="8" class="step"/>
<text x="660" y="855" class="h4" text-anchor="middle">rules_bridge generate</text>
<text x="660" y="874" class="tiny" text-anchor="middle">Studio Rules.incl</text>
<path d="M 740 861 L 758 861" class="arr" marker-end="url(#head)"/>
<rect x="758" y="832" width="160" height="58" rx="8" class="step"/>
<text x="838" y="855" class="h4" text-anchor="middle">LogicActivate</text>
<text x="838" y="874" class="tiny" text-anchor="middle">names, order, cycles</text>
<path d="M 918 861 L 936 861" class="arr" marker-end="url(#head)"/>
<rect x="936" y="832" width="160" height="58" rx="8" class="step"/>
<text x="1016" y="855" class="h4" text-anchor="middle">every save</text>
<text x="1016" y="874" class="tiny" text-anchor="middle">formulas · sums · checks</text>
<text x="46" y="920" class="small" text-anchor="start">Tests (tools/run_tests.sh): fblint · logic_reference (70 scenarios; --prove: every rule needed) · rules_bridge (23) · make_logic_test (the same 70 in FB, on a Mac) · ibtool (XIBs, on a Mac)</text>
</svg>
