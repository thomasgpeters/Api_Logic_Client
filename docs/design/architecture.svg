<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 960" width="1560" height="960" role="img" aria-label="App Builder for FutureBasic architecture">
<title>App Builder for FutureBasic — architecture</title>
<style>
  :root { --bg:#ffffff; --fg:#1d2430; --muted:#5a6473; --panel:#f4f6f9; --line:#c9d1dc; --accent:#2f5d8a;
          --src:#e8f1fb; --mod:#ffffff; --tool:#eef7ef; --res:#f6f1e7; --file:#ffffff; --runtime:#e9eef7; --gen:#eaf6f0; --tmpl:#fbf1e6; --build:#eef0f3; --app:#e7f0fa; --person:#f7eef6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16191d; --fg:#e6e9ee; --muted:#9aa3ae; --panel:#1e2329; --line:#3a434e; --accent:#8db6dd;
            --src:#1d2b3a; --mod:#232a32; --tool:#1f2e24; --res:#2d281f; --file:#232a32; --runtime:#222b3a; --gen:#1f2f28; --tmpl:#33291f; --build:#262b31; --app:#1d2a38; --person:#2f2330; }
  }
  .bg { fill: var(--bg); }
  text { font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: var(--fg); }
  .h1 { font-size: 24px; font-weight: 600; }
  .sub { font-size: 13px; fill: var(--muted); }
  .col { font-size: 12px; font-weight: 600; letter-spacing: .08em; fill: var(--accent); }
  .h3 { font-size: 14px; font-weight: 600; }
  .h4 { font-size: 12.5px; font-weight: 600; }
  .small { font-size: 11.5px; fill: var(--muted); }
  .tiny { font-size: 10.5px; fill: var(--muted); }
  .lbl { font-size: 10.5px; fill: var(--accent); }
  rect { stroke: var(--line); stroke-width: 1; }
  .panel { fill: var(--panel); }
  .box, .mod, .file { fill: var(--mod); }
  .src { fill: var(--src); } .tool { fill: var(--tool); } .res { fill: var(--res); } .person { fill: var(--person); }
  .runtime { fill: var(--runtime); } .gen { fill: var(--gen); } .tmpl { fill: var(--tmpl); }
  .build { fill: var(--build); } .app { fill: var(--app); stroke: var(--accent); stroke-width: 1.5; }
  .step { fill: var(--mod); }
  .arr, .arr2, .arr3 { fill: none; stroke: var(--accent); stroke-width: 1.4; }
  .arr2 { stroke-dasharray: 5 3; }
  .arr3 { stroke: var(--muted); stroke-dasharray: 2 3; }
  .head { fill: var(--accent); }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="head"/></marker>
  <marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="head"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1560" height="960" style="stroke:none"/>
<text x="30" y="44" class="h1" text-anchor="start">App Builder for FutureBasic — architecture</text>
<text x="30" y="70" class="sub" text-anchor="start">From a data model to a native Mac app with business rules: SQLite (lite edition) or API Logic Server → XIB parts, binding code, rules → a FutureBasic project built from the template and runtime.</text>
<text x="30" y="112" class="col" text-anchor="start">SOURCES</text>
<text x="300" y="112" class="col" text-anchor="start">THE GENERATOR (FB, MACOS)</text>
<text x="850" y="112" class="col" text-anchor="start">WORKSPACE: &lt;PROJECT&gt;/</text>
<text x="1150" y="112" class="col" text-anchor="start">GENERATED APP: FBAPP/</text>
<rect x="30" y="130" width="230" height="96" rx="10" class="src"/>
<text x="44" y="154" class="h3" text-anchor="start">SQLite database</text>
<text x="44" y="176" class="small" text-anchor="start">the lite edition’s catalyst:</text>
<text x="44" y="194" class="small" text-anchor="start">tables, keys, relationships</text>
<text x="44" y="212" class="small" text-anchor="start">read straight from the file</text>
<rect x="30" y="250" width="230" height="118" rx="10" class="src"/>
<text x="44" y="274" class="h3" text-anchor="start">API Logic Server project</text>
<text x="44" y="296" class="small" text-anchor="start">/metadata?include=attributes</text>
<text x="44" y="314" class="small" text-anchor="start">logic/declare_logic.py</text>
<text x="44" y="332" class="small" text-anchor="start">(LogicBank rules, Python)</text>
<text x="44" y="350" class="small" text-anchor="start">JSON:API for the ALS edition</text>
<rect x="30" y="392" width="230" height="78" rx="10" class="person"/>
<text x="44" y="416" class="h3" text-anchor="start">The designer</text>
<text x="44" y="438" class="small" text-anchor="start">Titles, widths, controls,</text>
<text x="44" y="456" class="small" text-anchor="start">rules, About text, …</text>
<rect x="300" y="124" width="520" height="640" rx="14" class="panel"/>
<rect x="316" y="138" width="488" height="62" rx="10" class="mod"/>
<text x="330" y="162" class="h3" text-anchor="start">Read the model</text>
<text x="330" y="184" class="small" text-anchor="start">SQLite Model.incl  ·  API Interface.incl (ALS /metadata)</text>
<rect x="316" y="214" width="488" height="82" rx="10" class="mod"/>
<text x="330" y="238" class="h3" text-anchor="start">Entity definitions</text>
<text x="330" y="260" class="small" text-anchor="start">Type Mapping.incl: FB type, size, control, Title, widths</text>
<text x="330" y="278" class="small" text-anchor="start">designer’s adjustments → Design.json</text>
<rect x="316" y="420" width="488" height="82" rx="10" class="mod"/>
<text x="330" y="444" class="h3" text-anchor="start">Rules page</text>
<text x="330" y="466" class="small" text-anchor="start">Rules.json: formula · constraint · sum · count · copy ·</text>
<text x="330" y="484" class="small" text-anchor="start">parent check · delete action · row / commit event</text>
<rect x="316" y="530" width="488" height="82" rx="10" class="mod"/>
<text x="330" y="554" class="h3" text-anchor="start">App Generator.incl</text>
<text x="330" y="576" class="small" text-anchor="start">the FB project: data.fbproj groups, &lt;project&gt;.main,</text>
<text x="330" y="594" class="small" text-anchor="start">Model.json, Credits.rtf; runtime + templates copied</text>
<rect x="316" y="310" width="238" height="92" rx="10" class="mod"/>
<text x="330" y="334" class="h3" text-anchor="start">XIB Generator.incl</text>
<text x="330" y="356" class="small" text-anchor="start">&lt;Entity&gt;Form.xib</text>
<text x="330" y="374" class="small" text-anchor="start">&lt;Entity&gt;List.xib</text>
<text x="330" y="392" class="small" text-anchor="start">Model Tags.incl</text>
<rect x="566" y="310" width="238" height="92" rx="10" class="mod"/>
<text x="580" y="334" class="h3" text-anchor="start">Binding Generator.incl</text>
<text x="580" y="356" class="small" text-anchor="start">&lt;Entity&gt; Binding.incl</text>
<text x="580" y="374" class="small" text-anchor="start">record ↔ Form</text>
<text x="580" y="392" class="small" text-anchor="start">records → List</text>
<rect x="566" y="640" width="238" height="108" rx="10" class="tool"/>
<text x="580" y="664" class="h3" text-anchor="start">tools/rules_bridge.py</text>
<text x="580" y="686" class="small" text-anchor="start">import / export declare_logic.py</text>
<text x="580" y="704" class="small" text-anchor="start">check (names, cycles)</text>
<text x="580" y="722" class="small" text-anchor="start">generate Studio Rules.incl</text>
<text x="580" y="740" class="small" text-anchor="start">(python3, run by the generator)</text>
<rect x="316" y="640" width="238" height="108" rx="10" class="res"/>
<text x="330" y="664" class="h3" text-anchor="start">Bundled with the generator</text>
<text x="330" y="686" class="small" text-anchor="start">src/Templates/  starting files</text>
<text x="330" y="704" class="small" text-anchor="start">src/Runtime/  FB runtime</text>
<text x="330" y="722" class="small" text-anchor="start">Branding.incl  name + logo</text>
<text x="330" y="740" class="small" text-anchor="start">(never written to)</text>
