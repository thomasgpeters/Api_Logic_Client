# nginx in front of a Web Toolkit for FutureBasic app (the app template)
#
# nginx speaks HTTP (and HTTPS) to the browsers and FastCGI to the FB app on 127.0.0.1:9010.
# Test:   nginx -c "$PWD/nginx.conf" -p "$PWD"      then open http://127.0.0.1:8088/
# On a server, put the "server" block in nginx's own configuration and add HTTPS (Let's Encrypt).

worker_processes 1;
error_log nginx-error.log;
pid nginx.pid;
events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;
    client_max_body_size 1m;

    server {
        listen 127.0.0.1:8088;

        location / {
            include fastcgi_params;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_pass 127.0.0.1:9010;
            fastcgi_keep_conn on;
            fastcgi_read_timeout 60s;
        }
    }
}
