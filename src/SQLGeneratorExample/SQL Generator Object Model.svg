<path d="M720 206 a8 8 0 0 1 8 -8 h284 a8 8 0 0 1 8 8 v22 h-300 z" class="band"/>
<text x="732" y="218" class="title">one entry</text>
<text x="1008" y="218" class="kind" text-anchor="end">NSMutableDictionary</text>
<text x="732" y="246" class="key">columnname</text>
<text x="1008" y="246" class="val" text-anchor="end">"p.surName"</text>
<text x="732" y="268" class="key">aliasname</text>
<text x="1008" y="268" class="val" text-anchor="end">"Surname"</text>
</g>
<text x="720" y="298" class="note">fn AddColumnToQuery</text>
<path d="M580 241 C650.0 241 650.0 241 714 241" class="link" marker-end="url(#arrow)"/>
<g class="array"><rect x="360" y="316" width="220" height="84" rx="8" class="body"/>
<path d="M360 324 a8 8 0 0 1 8 -8 h204 a8 8 0 0 1 8 8 v22 h-220 z" class="band"/>
<text x="372" y="336" class="title">associations</text>
<text x="568" y="336" class="kind" text-anchor="end">NSMutableArray</text>
<text x="372" y="364" class="key">[0]</text>
<text x="568" y="364" class="val" text-anchor="end">dictionary</text>
<text x="372" y="386" class="key">[1] ...</text>
</g>
<path d="M280 167 C320.0 167 320.0 359 354 359" class="link" marker-end="url(#arrow)"/>
<g class="dict"><rect x="720" y="316" width="300" height="150" rx="8" class="body"/>
<path d="M720 324 a8 8 0 0 1 8 -8 h284 a8 8 0 0 1 8 8 v22 h-300 z" class="band"/>
<text x="732" y="336" class="title">one entry</text>
<text x="1008" y="336" class="kind" text-anchor="end">NSMutableDictionary</text>
<text x="732" y="364" class="key">lefttablealias</text>
<text x="1008" y="364" class="val" text-anchor="end">"a"</text>
<text x="732" y="386" class="key">leftcolumnname</text>
<text x="1008" y="386" class="val" text-anchor="end">"personID"</text>
<text x="732" y="408" class="key">righttablealias</text>
<text x="1008" y="408" class="val" text-anchor="end">"p"</text>
<text x="732" y="430" class="key">rightcolumnname</text>
<text x="1008" y="430" class="val" text-anchor="end">"id"</text>
<text x="732" y="452" class="key">operator</text>
<text x="1008" y="452" class="val" text-anchor="end">_isEqual</text>
</g>
<text x="720" y="482" class="note">fn AddAssociationToQuery</text>
<path d="M580 359 C650.0 359 650.0 359 714 359" class="link" marker-end="url(#arrow)"/>
<g class="array"><rect x="360" y="500" width="220" height="84" rx="8" class="body"/>
