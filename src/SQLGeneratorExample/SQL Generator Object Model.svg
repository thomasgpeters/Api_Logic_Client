<text x="568" y="520" class="kind" text-anchor="end">NSMutableArray</text>
<text x="372" y="548" class="key">[0]</text>
<text x="568" y="548" class="val" text-anchor="end">dictionary</text>
<text x="372" y="570" class="key">[1] ...</text>
</g>
<path d="M280 189 C320.0 189 320.0 543 354 543" class="link" marker-end="url(#arrow)"/>
<g class="dict"><rect x="720" y="500" width="300" height="172" rx="8" class="body"/>
<path d="M720 508 a8 8 0 0 1 8 -8 h284 a8 8 0 0 1 8 8 v22 h-300 z" class="band"/>
<text x="732" y="520" class="title">one entry</text>
<text x="1008" y="520" class="kind" text-anchor="end">NSMutableDictionary</text>
<text x="732" y="548" class="key">tablealias</text>
<text x="1008" y="548" class="val" text-anchor="end">"p"</text>
<text x="732" y="570" class="key">columnname</text>
<text x="1008" y="570" class="val" text-anchor="end">"balance"</text>
<text x="732" y="592" class="key">value</text>
<text x="1008" y="592" class="val" text-anchor="end">100.0  (NSNumber)</text>
<text x="732" y="614" class="key">type</text>
<text x="1008" y="614" class="val" text-anchor="end">_realType</text>
<text x="732" y="636" class="key">operator</text>
<text x="1008" y="636" class="val" text-anchor="end">_isGreaterThan</text>
<text x="732" y="658" class="key">logic</text>
<text x="1008" y="658" class="val" text-anchor="end">_and | _or (2nd on)</text>
</g>
<text x="720" y="688" class="note">fn AddFilterToQuery</text>
<path d="M580 543 C650.0 543 650.0 543 714 543" class="link" marker-end="url(#arrow)"/>
<g class="out"><rect x="30" y="292" width="250" height="34" rx="17" class="pill"/><text x="155.0" y="314" text-anchor="middle" class="pilltext">fn GenerateSelectSQL( query )</text></g>
<g class="out"><rect x="30" y="336" width="250" height="34" rx="17" class="pill"/><text x="155.0" y="358" text-anchor="middle" class="pilltext">fn QueryParameterValues( query )</text></g>
<text x="30" y="394" class="code">SELECT "p"."surName" AS "Surname"</text>
<text x="30" y="412" class="code">  FROM "person" AS "p"</text>
<text x="30" y="430" class="code"> WHERE "p"."balance" &gt; ?</text>
<text x="30" y="454" class="code2">values: [ 100.0 ]</text>
<text x="30" y="484" class="note">rows come back as an array of</text>
<text x="30" y="500" class="note">dictionaries: { "Surname": "Fischer" }</text>
<text x="30" y="726" class="h">INSERT, UPDATE, DELETE: a dictionary per statement</text>
<text x="30" y="746" class="sub">the table, the column values in SQL order, and the filters (the same entries as a query's)</text>
<g class="dict"><rect x="30" y="766" width="230" height="84" rx="8" class="body"/>
<path d="M30 774 a8 8 0 0 1 8 -8 h214 a8 8 0 0 1 8 8 v22 h-230 z" class="band"/>
<text x="42" y="786" class="title">insert</text>
<text x="248" y="786" class="kind" text-anchor="end">NSMutableDictionary</text>
<text x="42" y="814" class="key">insertintotable</text>
<text x="248" y="814" class="val" text-anchor="end">"person"</text>
<text x="42" y="836" class="key">columnvalues</text>
<text x="248" y="836" class="val" text-anchor="end">array</text>
</g>
<text x="30" y="866" class="note">fn InitInsertIntoDictionary</text>
<g class="out"><rect x="30" y="880" width="230" height="34" rx="17" class="pill"/><text x="145.0" y="902" text-anchor="middle" class="pilltext">fn GenerateInsertIntoSQL</text></g>
<g class="dict"><rect x="282" y="766" width="230" height="106" rx="8" class="body"/>
<path d="M282 774 a8 8 0 0 1 8 -8 h214 a8 8 0 0 1 8 8 v22 h-230 z" class="band"/>
<text x="294" y="786" class="title">insert rows</text>
<text x="500" y="786" class="kind" text-anchor="end">NSMutableDictionary</text>
<text x="294" y="814" class="key">insertintotable</text>
<text x="500" y="814" class="val" text-anchor="end">"person"</text>
<text x="294" y="836" class="key">rows</text>
<text x="500" y="836" class="val" text-anchor="end">array</text>
<text x="294" y="858" class="key">columnnames</text>
<text x="500" y="858" class="val" text-anchor="end">array</text>
</g>
<text x="282" y="888" class="note">fn InitInsertRowsDictionary</text>
<g class="out"><rect x="282" y="902" width="230" height="34" rx="17" class="pill"/><text x="397.0" y="924" text-anchor="middle" class="pilltext">fn GenerateInsertRowsSQL</text></g>
<g class="dict"><rect x="534" y="766" width="230" height="106" rx="8" class="body"/>
<path d="M534 774 a8 8 0 0 1 8 -8 h214 a8 8 0 0 1 8 8 v22 h-230 z" class="band"/>
