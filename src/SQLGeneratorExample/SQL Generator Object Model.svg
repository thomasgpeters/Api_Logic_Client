<text x="372" y="246" class="key">[0]</text>
<text x="568" y="246" class="val" text-anchor="end">dictionary</text>
<text x="372" y="268" class="key">[1] ...</text>
</g>
<path d="M280 145 C320.0 145 320.0 241 354 241" class="link" marker-end="url(#arrow)"/>
