<text x="752" y="786" class="kind" text-anchor="end">NSMutableDictionary</text>
<text x="546" y="814" class="key">updatetable</text>
<text x="752" y="814" class="val" text-anchor="end">"person"</text>
<text x="546" y="836" class="key">columnvalues</text>
<text x="752" y="836" class="val" text-anchor="end">array</text>
<text x="546" y="858" class="key">filter</text>
<text x="752" y="858" class="val" text-anchor="end">array</text>
</g>
<text x="534" y="888" class="note">fn InitUpdateDictionary</text>
<g class="out"><rect x="534" y="902" width="230" height="34" rx="17" class="pill"/><text x="649.0" y="924" text-anchor="middle" class="pilltext">fn GenerateUpdateSQL</text></g>
<g class="dict"><rect x="786" y="766" width="230" height="84" rx="8" class="body"/>
<path d="M786 774 a8 8 0 0 1 8 -8 h214 a8 8 0 0 1 8 8 v22 h-230 z" class="band"/>
<text x="798" y="786" class="title">delete</text>
<text x="1004" y="786" class="kind" text-anchor="end">NSMutableDictionary</text>
<text x="798" y="814" class="key">deletefromtable</text>
<text x="1004" y="814" class="val" text-anchor="end">"contact"</text>
