<text x="732" y="128" class="key">tablename</text>
<text x="1008" y="128" class="val" text-anchor="end">"person"</text>
<text x="732" y="150" class="key">aliasname</text>
<text x="1008" y="150" class="val" text-anchor="end">"p"</text>
</g>
<text x="720" y="180" class="note">fn AddTableToQuery</text>
<path d="M580 123 C650.0 123 650.0 123 714 123" class="link" marker-end="url(#arrow)"/>
<g class="array"><rect x="360" y="198" width="220" height="84" rx="8" class="body"/>
<path d="M360 206 a8 8 0 0 1 8 -8 h204 a8 8 0 0 1 8 8 v22 h-220 z" class="band"/>
