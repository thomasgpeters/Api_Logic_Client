<text x="500" y="982" class="kind" text-anchor="end">NSMutableDictionary</text>
<text x="42" y="1010" class="key">columnname</text>
<text x="500" y="1010" class="val" text-anchor="end">"surName"</text>
<text x="42" y="1032" class="key">value</text>
<text x="500" y="1032" class="val" text-anchor="end">"Lima"  (NULL: SQL NULL)</text>
<text x="42" y="1054" class="key">type</text>
<text x="500" y="1054" class="val" text-anchor="end">_textType</text>
</g>
<text x="30" y="1084" class="note">fn AddColumnToInsert / fn AddColumnToUpdate</text>
<g class="dict"><rect x="534" y="962" width="482" height="106" rx="8" class="body"/>
<path d="M534 970 a8 8 0 0 1 8 -8 h466 a8 8 0 0 1 8 8 v22 h-482 z" class="band"/>
<text x="546" y="982" class="title">a rows entry: a SELECT row, reversed</text>
<text x="1004" y="982" class="kind" text-anchor="end">NSMutableDictionary</text>
<text x="546" y="1010" class="key">"givenName"</text>
<text x="1004" y="1010" class="val" text-anchor="end">"Kai"</text>
<text x="546" y="1032" class="key">"surName"</text>
<text x="1004" y="1032" class="val" text-anchor="end">"Nakamura"</text>
<text x="546" y="1054" class="key">"balance"</text>
<text x="1004" y="1054" class="val" text-anchor="end">15.0  (missing: NULL)</text>
</g>
<text x="534" y="1084" class="note">fn AddRowsToInsert: an array of these</text>
<text x="30" y="1114" class="note">An UPDATE or DELETE with an empty filter array gets NULL from its Generate... function: it never changes a whole table.</text>
<text x="30" y="1132" class="note">fn QueryParameterValues lists the values in placeholder order: column values, then rows, then filters.</text>
</svg>
