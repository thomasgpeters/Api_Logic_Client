<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1144" width="1060" height="1144" role="img" aria-label="SQL Generator object model">
<title>SQL Generator object model</title>
<style>
:root{--bg:#ffffff;--ink:#1d2433;--muted:#5b6475;--line:#c9d1de;--dict:#112850;--dictInk:#ffffff;
--array:#0f766e;--arrayInk:#ffffff;--body:#f6f8fb;--key:#1d2433;--val:#5b3cc4;--pill:#eef2f8;--code:#1f5fbf}
@media (prefers-color-scheme: dark){:root{--bg:#14171c;--ink:#e7ebf2;--muted:#a3acbb;--line:#3a4250;
--dict:#2b4c8c;--array:#138a80;--body:#1d222a;--key:#e7ebf2;--val:#b9a6ff;--pill:#232a35;--code:#7fb0ff}}
svg{background:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.h{font-size:19px;font-weight:700}.sub{font-size:13px;fill:var(--muted)}
.body{fill:var(--body);stroke:var(--line)}
.dict .band{fill:var(--dict)}.array .band{fill:var(--array)}
.title{font-size:13px;font-weight:700;fill:#ffffff}.kind{font-size:10.5px;fill:#ffffff;opacity:.8}
.key{font-size:12.5px;font-family:Menlo,Monaco,monospace;fill:var(--key)}
.val{font-size:12px;font-family:Menlo,Monaco,monospace;fill:var(--val)}
.note{font-size:12px;fill:var(--muted)}.label{font-size:11px;fill:var(--muted)}
.link{fill:none;stroke:var(--muted);stroke-width:1.4}
.pill{fill:var(--pill);stroke:var(--line)}.pilltext{font-size:12.5px;font-family:Menlo,Monaco,monospace}
.code{font-size:12.5px;font-family:Menlo,Monaco,monospace;fill:var(--code)}
.code2{font-size:12.5px;font-family:Menlo,Monaco,monospace;fill:var(--val)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a93a3"/></marker></defs>
<text x="30" y="40" class="h">SELECT: a query is a dictionary of arrays</text>
<text x="30" y="60" class="sub">fn InitQueryDictionary makes it; each Add... function adds one dictionary to an array</text>
<g class="dict"><rect x="30" y="80" width="250" height="172" rx="8" class="body"/>
<path d="M30 88 a8 8 0 0 1 8 -8 h234 a8 8 0 0 1 8 8 v22 h-250 z" class="band"/>
<text x="42" y="100" class="title">query</text>
<text x="268" y="100" class="kind" text-anchor="end">NSMutableDictionary</text>
<text x="42" y="128" class="key">selecttables</text>
<text x="268" y="128" class="val" text-anchor="end">array</text>
<text x="42" y="150" class="key">selectcols</text>
<text x="268" y="150" class="val" text-anchor="end">array</text>
<text x="42" y="172" class="key">associations</text>
<text x="268" y="172" class="val" text-anchor="end">array</text>
<text x="42" y="194" class="key">filter</text>
<text x="268" y="194" class="val" text-anchor="end">array</text>
<text x="42" y="216" class="key">metadata</text>
<text x="268" y="216" class="val" text-anchor="end">array</text>
<text x="42" y="238" class="key">results</text>
<text x="268" y="238" class="val" text-anchor="end">dictionary</text>
</g>
<text x="30" y="268" class="note">fn InitQueryDictionary</text>
<g class="array"><rect x="360" y="80" width="220" height="84" rx="8" class="body"/>
<path d="M360 88 a8 8 0 0 1 8 -8 h204 a8 8 0 0 1 8 8 v22 h-220 z" class="band"/>
<text x="372" y="100" class="title">selecttables</text>
<text x="568" y="100" class="kind" text-anchor="end">NSMutableArray</text>
<text x="372" y="128" class="key">[0]</text>
<text x="568" y="128" class="val" text-anchor="end">dictionary</text>
<text x="372" y="150" class="key">[1] ...</text>
</g>
<path d="M280 123 C320.0 123 320.0 123 354 123" class="link" marker-end="url(#arrow)"/>
