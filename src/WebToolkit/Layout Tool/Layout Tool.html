<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout Tool</title>
<!--
  Layout Tool - Web Toolkit for FutureBasic

  Lays out a page in a XIB: the file Interface Builder edits and a desktop app loads, which the Web Toolkit also
  serves as a web page (Web Layout.incl). Open a XIB, or start a new one; drag controls from the palette, move and
  resize them, give each an Identifier (its widget id in FB); see the page as the web will show it; copy the FB that
  loads it; save it as .xib (desktop, Interface Builder) and as .webxib (the web app's Resources).

  The web preview follows the toolkit's layout rules exactly (tools/web_layout_reference.py is the reference, and
  tools/check_layout_tool.py holds this page to it). A XIB opened here keeps everything this page does not edit.

  One file, no network: open it in any browser. MIT License. Copyright (c) 2026 Imagery Business Systems, LLC.
-->
<style>
:root {
  --bg: #f5f5f7; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --border: #d2d2d7; --accent: #0a63c9;
  --on-accent: #ffffff; --canvas: #ececee; --view: #ffffff; --sel: #0a63c9; --ctl: #ffffff; --ctl-border: #b8b8be;
  --danger: #c62828; --grid: rgba(0, 0, 0, .05); color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161618; --panel: #1f1f22; --text: #f2f2f4; --muted: #a1a1a6; --border: #3a3a3f; --accent: #4c9bff;
    --on-accent: #0b1320; --canvas: #111113; --view: #26262a; --sel: #4c9bff; --ctl: #303035; --ctl-border: #55555c;
    --danger: #ff6b6b; --grid: rgba(255, 255, 255, .05); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161618; --panel: #1f1f22; --text: #f2f2f4; --muted: #a1a1a6; --border: #3a3a3f; --accent: #4c9bff;
  --on-accent: #0b1320; --canvas: #111113; --view: #26262a; --sel: #4c9bff; --ctl: #303035; --ctl-border: #55555c;
  --danger: #ff6b6b; --grid: rgba(255, 255, 255, .05); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; height: 100vh; display: flex; flex-direction: column; }
header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 14px; margin: 0 12px 0 0; }
header .name { font-weight: 600; }
button, select, input, textarea { font: inherit; color: var(--text); }
button { background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.spacer { flex: 1; }
main { flex: 1; display: grid; grid-template-columns: 150px 1fr 280px; min-height: 0; }
aside { background: var(--panel); border-right: 1px solid var(--border); overflow: auto; padding: 10px; }
aside.inspector { border-right: 0; border-left: 1px solid var(--border); }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 6px 0 8px; }
.palette button { display: block; width: 100%; text-align: left; margin: 0 0 4px; border-radius: 8px; }
.stage { overflow: auto; background: var(--canvas); padding: 24px; position: relative; }
#view { position: relative; background: var(--view); box-shadow: 0 1px 4px rgba(0, 0, 0, .15); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 8px 8px; }
.ctl { position: absolute; border: 1px solid transparent; border-radius: 4px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; cursor: move; user-select: none; padding: 0 4px; }
.ctl:hover { border-color: var(--ctl-border); }
.ctl.sel { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); }
.ctl .handle { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; background: var(--sel); cursor: nwse-resize; display: none; }
.ctl.sel .handle { display: block; }
.k-field, .k-textarea, .k-select { background: var(--ctl); border-color: var(--ctl-border); color: var(--muted); }
.k-textarea { align-items: flex-start; padding-top: 3px; white-space: normal; }
.k-select::after { content: "\2195"; margin-left: auto; color: var(--muted); }
.k-button { background: var(--ctl); border-color: var(--ctl-border); border-radius: 999px; justify-content: center; }
.k-button.default { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.k-heading { font-size: 20px; font-weight: 700; }
.k-text.muted { color: var(--muted); }
.k-checkbox::before { content: "\2610"; margin-right: 4px; }
.k-radio { flex-wrap: wrap; gap: 0 10px; }
.k-table { background: var(--ctl); border-color: var(--ctl-border); align-items: flex-start; flex-direction: column; padding: 0; }
.k-table .cols { display: flex; width: 100%; border-bottom: 1px solid var(--ctl-border); font-weight: 600; }
.k-table .cols span { flex: 1; padding: 2px 4px; overflow: hidden; text-overflow: ellipsis; }
.k-box { border: 1px solid var(--ctl-border); align-items: flex-start; padding: 0; overflow: visible; }
.k-box > .title { position: absolute; top: -9px; left: 8px; background: var(--view); padding: 0 4px; font-weight: 600; }
.k-divider { border-top: 1px solid var(--ctl-border); border-radius: 0; height: 1px !important; }
.k-image { background: var(--ctl); border: 1px dashed var(--ctl-border); justify-content: center; color: var(--muted); }
.k-hidden { opacity: .4; }
.inspector label { display: block; margin: 8px 0 2px; color: var(--muted); font-size: 12px; }
.inspector input[type=text], .inspector input[type=number], .inspector textarea, .inspector select { width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 4px 6px; }
.inspector textarea { min-height: 70px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.inspector .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.inspector .check { display: flex; gap: 6px; align-items: center; margin-top: 8px; color: var(--text); }
.inspector .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
.inspector .problem { color: var(--danger); }
#preview { display: none; flex-direction: column; height: 100%; }
#preview iframe { flex: 1; width: 100%; border: 1px solid var(--border); background: #fff; border-radius: 6px; margin: 0 auto; }
#preview .bar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
#code { width: 100%; min-height: 260px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.dialog { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); display: none; align-items: center; justify-content: center; z-index: 5; }
.dialog > div { background: var(--panel); border-radius: 12px; padding: 16px; width: min(720px, 92vw); box-shadow: 0 10px 40px rgba(0, 0, 0, .3); }
.drop { outline: 3px dashed var(--accent); outline-offset: -12px; }
#status { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Layout Tool</h1>
  <span class="name" id="docName">Untitled</span>
  <button id="newBtn" title="A new, empty layout">New</button>
  <button id="openBtn" title="Open a .xib or .webxib">Open…</button>
  <input type="file" id="fileInput" accept=".xib,.webxib,.xml" hidden>
  <button id="undoBtn" title="Undo (Cmd/Ctrl+Z)">Undo</button>
  <span class="seg"><button id="designTab" aria-pressed="true">Design</button><button id="webTab" aria-pressed="false">Web Preview</button></span>
  <span class="spacer"></span>
  <span id="status"></span>
  <button id="codeBtn" title="The FB that loads this layout">FB Code…</button>
  <button id="saveXibBtn" title="For a desktop app and Interface Builder">Save .xib</button>
  <button id="saveWebBtn" class="primary" title="For the web app's Resources">Save .webxib</button>
</header>
<main>
  <aside class="palette" id="palette">
    <h2>Add</h2>
  </aside>
  <section class="stage" id="stage">
    <div id="design"><div id="view"></div></div>
    <div id="preview">
      <div class="bar">
        <span class="seg"><button id="wideBtn" aria-pressed="true">Desktop</button><button id="phoneBtn" aria-pressed="false">Phone</button></span>
        <select id="themeSel" title="The web theme"><option value="">Theme: as the system</option><option value="light">Light</option><option value="dark">Dark</option><option value="colourful">Colourful</option><option value="base">Base</option></select>
      </div>
      <iframe id="frame" title="The page as the web shows it"></iframe>
    </div>
  </section>
  <aside class="inspector" id="inspector"></aside>
</main>
<div class="dialog" id="codeDialog"><div>
  <h2 style="margin-top:0">FB code for this layout</h2>
  <p class="note">Add <b id="codeFile">Layout.webxib</b> to the web app's Resources, then in Pages.incl:</p>
  <textarea id="code" readonly></textarea>
  <p style="text-align:right;margin-bottom:0"><button id="copyCode">Copy</button> <button id="closeCode" class="primary">Close</button></p>
</div></div>
<script>
(function () {
  'use strict';

  // ================= the layout rules (the same as tools/web_layout_reference.py) =================

  const INPUT_KINDS = ['field', 'textarea', 'select', 'radio'];
  const HEADING_STYLES = { largeTitle: 1, title1: 2, title2: 2, title3: 3, headline: 4 };
  const kids = (el) => (el ? Array.from(el.children) : []);
  const attr = (el, n) => (el ? el.getAttribute(n) : null);
  const is = (el, n, v) => attr(el, n) === v;
  const num = (v) => { const f = parseFloat(v); return isNaN(f) ? 0 : f; };
  const halfUp = (v) => Math.floor(v + 0.5);
  const keyed = (el, tag, key) => kids(el).find((c) => c.tagName === tag && is(c, 'key', key)) || null;
  const cellOf = (el) => kids(el).find((c) => is(c, 'key', 'cell')) || null;
  const subviewsOf = (el) => { const s = kids(el).find((c) => c.tagName === 'subviews'); return s ? kids(s) : []; };
  const descendants = (el, tag) => (el ? Array.from(el.getElementsByTagName(tag)) : []);
  function frameOf(el) {
    const r = kids(el).find((c) => c.tagName === 'rect' && is(c, 'key', 'frame'));
    return r ? [num(attr(r, 'x')), num(attr(r, 'y')), num(attr(r, 'width')), num(attr(r, 'height'))] : [0, 0, 0, 0];
  }
  function stripColon(t) { let s = (t || '').trim(); if (s.endsWith(':')) s = s.slice(0, -1).trim(); return s; }

  function extractor() {
    const used = new Set();
    const unique = (wid) => { let base = wid, n = 2; while (used.has(wid)) { wid = base + '-' + n; n++; } used.add(wid); return wid; };
    function widgetId(el, fallback) {
      for (const e of [el, fallback]) if (e && attr(e, 'identifier')) return unique(attr(e, 'identifier'));
      for (const e of [el, fallback]) if (e && attr(e, 'tag') && attr(e, 'tag') !== '0') return unique('tag' + attr(e, 'tag'));
      return unique(attr(el, 'id') || 'control');
    }
    function common(el, c) {
      const cell = cellOf(el);
      if (is(el, 'hidden', 'YES')) c.visible = false;
      if (is(el, 'enabled', 'NO') || is(cell, 'enabled', 'NO')) c.enabled = false;
      return c;
    }
    function control(el, c) {
      const tag = el.tagName, cell = cellOf(el), h = c.h;
      if (['textField', 'secureTextField', 'searchField', 'comboBox'].includes(tag)) {
        const title = attr(cell, 'title') || '';
        const editable = is(cell, 'editable', 'YES');
        if (tag !== 'textField' || editable) {
          if (tag === 'textField' && is(cell, 'lineBreakMode', 'wordWrapping') && h > 30) {
            c.kind = 'textarea'; c.lines = Math.max(2, halfUp(h / 17));
          } else {
            let itype = { secureTextField: 'password', searchField: 'search' }[tag] || 'text';
            if (keyed(cell, 'numberFormatter', 'formatter')) itype = 'number';
            c.kind = 'field'; c.type = itype;
          }
          c.placeholder = attr(cell, 'placeholderString') || ''; c.label = '';
        } else {
          const font = keyed(cell, 'font', 'font'), color = keyed(cell, 'color', 'textColor');
          const style = attr(font, 'textStyle');
          if (!title.trim() && attr(el, 'identifier')) { c.kind = 'message'; c.text = ''; c.role = 'info'; }
          else if (style && HEADING_STYLES[style]) { c.kind = 'heading'; c.text = title; c.level = HEADING_STYLES[style]; }
          else {
            c.kind = 'text'; c.text = title;
            c.look = (is(color, 'name', 'secondaryLabelColor') || is(color, 'name', 'tertiaryLabelColor')) ? 'muted' : '';
            c.labelCandidate = title.trim().length > 0;
          }
        }
      } else if (tag === 'datePicker') {
        const els = keyed(cell, 'datePickerElements', 'datePickerElements');
        const d = is(els, 'day', 'YES'), t = is(els, 'hour', 'YES');
        c.kind = 'field'; c.type = d && t ? 'datetime-local' : (t ? 'time' : 'date'); c.placeholder = ''; c.label = '';
      } else if (tag === 'slider' || tag === 'colorWell') {
        c.kind = 'field'; c.type = tag === 'slider' ? 'range' : 'color'; c.placeholder = ''; c.label = '';
      } else if (tag === 'button') {
        const btype = attr(cell, 'type') || 'push', title = attr(cell, 'title') || '';
        if (btype === 'check') { c.kind = 'checkbox'; c.label = title; }
        else if (btype === 'radio') { c.kind = 'radio'; c.label = ''; c.options = [{ code: title, title }]; }
        else {
          if (!title.trim()) return null;
          const k = keyed(cell, 'string', 'keyEquivalent');
          c.kind = 'button'; c.text = title; c.role = (k && k.textContent.trim() === 'DQ') ? 'primary' : 'secondary';
        }
      } else if (tag === 'popUpButton') {
        const opts = [];
        for (const item of descendants(el, 'menuItem')) {
          if (is(item, 'isSeparatorItem', 'YES')) continue;
          const t = attr(item, 'title') || '', code = attr(item, 'tag');
          opts.push({ code: (code === null || code === '0') ? t : code, title: t });
        }
        c.kind = 'select'; c.options = opts; c.label = '';
      } else if (tag === 'scrollView') {
        const clip = keyed(el, 'clipView', 'contentView');
        const doc = clip ? (subviewsOf(clip)[0] || null) : null;
        if (doc && (doc.tagName === 'tableView' || doc.tagName === 'outlineView')) {
          const cols = [];
          for (const col of descendants(doc, 'tableColumn')) {
            const head = keyed(col, 'tableHeaderCell', 'headerCell');
            const ident = attr(col, 'identifier');
            let title = attr(head, 'title') || '';
            if (!title) title = ident || '';
            const entry = { key: ident || title, title };
            if (is(head, 'alignment', 'right')) entry.align = 'end';
            cols.push(entry);
          }
          c.kind = 'table'; c.columns = cols; c.id = widgetId(doc, el);
          return common(el, c);
        }
        if (doc && doc.tagName === 'textView') {
          c.kind = 'textarea'; c.lines = Math.max(2, halfUp(h / 17)); c.label = ''; c.id = widgetId(doc, el);
          return common(el, c);
        }
        return null;
      } else if (tag === 'box') {
        if (is(el, 'boxType', 'separator')) c.kind = 'divider';
        else {
          const content = keyed(el, 'view', 'contentView');
          let children = [];
          if (content) children = controls(content, frameOf(content)[3], 0, 0);
          let title = attr(el, 'title') || '';
          if (is(el, 'titlePosition', 'noTitle')) title = '';
          c.kind = 'box'; c.title = title; c.children = children;
        }
      } else if (tag === 'imageView') {
        let image = attr(cell, 'image') || '';
        if (image && !image.includes('.')) image += '.png';
        c.kind = 'image'; c.src = image; c.alt = '';
      } else return null;
      c.id = widgetId(el, null);
      return common(el, c);
    }
    function controls(view, height, dx, dy) {
      const out = [];
      for (const el of subviewsOf(view)) {
        const [x, y, w, h] = frameOf(el);
        const c = { x: x + dx, top: height - (y + h) + dy, w, h, xibId: attr(el, 'id') };
        if (el.tagName === 'customView' || el.tagName === 'view') {
          const ks = subviewsOf(el);
          if (ks.length && ks.every((k) => k.tagName === 'button' && is(cellOf(k), 'type', 'radio'))) {
            c.kind = 'radio'; c.label = '';
            c.options = ks.map((b) => { const t = attr(cellOf(b), 'title') || ''; return { code: t, title: t }; });
            c.id = widgetId(el, null);
            out.push(common(el, c));
          } else out.push(...controls(el, h, c.x, c.top));
          continue;
        }
        const made = control(el, c);
        if (made) out.push(made);
      }
      return out;
    }
    return { controls };
  }

  const center = (c) => c.top + c.h / 2;
  function stableSort(items, cmp) { return items.map((v, i) => [v, i]).sort((a, b) => cmp(a[0], b[0]) || a[1] - b[1]).map((p) => p[0]); }
  const byTopX = (a, b) => (a.top - b.top) || (a.x - b.x);

  function pairLabels(controls) {
    const labels = stableSort(controls.filter((c) => c.labelCandidate), byTopX);
    const inputs = controls.filter((c) => INPUT_KINDS.includes(c.kind));
    for (const lab of labels) {
      let best = null, bestGap = 0;
      const right = lab.x + lab.w;
      for (const inp of inputs) {
        if (inp.paired) continue;
        const gap = inp.x - right;
        const sameBand = Math.abs(center(inp) - center(lab)) <= Math.max(lab.h, 22) / 2 + 4 || (lab.top >= inp.top - 4 && lab.top <= inp.top + 8);
        if (sameBand && gap >= -8 && gap <= 40 && (best === null || gap < bestGap)) { best = inp; bestGap = gap; }
      }
      if (best === null) {
        const bottom = lab.top + lab.h;
        for (const inp of inputs) {
          if (inp.paired) continue;
          const gap = inp.top - bottom;
          if (gap >= -4 && gap <= 12 && Math.abs(inp.x - lab.x) <= 16 && (best === null || gap < bestGap)) { best = inp; bestGap = gap; }
        }
        if (best) { best.label = stripColon(lab.text); best.paired = true; lab.gone = true; }
        continue;
      }
      best.label = stripColon(lab.text);
      best.w = best.x + best.w - lab.x;
      best.x = lab.x;
      best.paired = true; lab.gone = true;
    }
    return controls.filter((c) => !c.gone);
  }

  function anyInput(ws) { return ws.some((w) => [...INPUT_KINDS, 'checkbox'].includes(w.kind) || anyInput(w.children)); }

  function widgetOf(c, width) {
    const k = c.kind;
    const pick = (...keys) => { const p = {}; for (const key of keys) p[key] = c[key] === undefined ? '' : c[key]; return p; };
    let props = {};
    if (k === 'heading') props = pick('text', 'level');
    else if (k === 'text') props = pick('text', 'look');
    else if (k === 'field') props = pick('label', 'type', 'placeholder');
    else if (k === 'textarea') props = pick('label', 'lines');
    else if (k === 'checkbox') props = pick('label');
    else if (k === 'radio' || k === 'select') props = pick('label', 'options');
    else if (k === 'button') props = pick('text', 'role');
    else if (k === 'table') props = pick('columns');
    else if (k === 'image') props = pick('src', 'alt');
    else if (k === 'message') props = pick('text', 'role');
    if (c.visible === false) props.visible = false;
    if (c.enabled === false) props.enabled = false;
    if (k === 'box') {
      const inner = layout(pairLabels(c.children), c.w, c.id);
      const hasInput = anyInput(inner);
      if (c.title) inner.unshift({ kind: 'heading', id: c.id + '-title', props: { text: c.title, level: 3 }, children: [] });
      const bp = { layout: hasInput ? 'form' : 'card' };
      if (c.visible === false) bp.visible = false;
      return { kind: 'container', id: c.id, props: bp, children: inner, xibId: c.xibId };
    }
    return { kind: k, id: c.id, props, children: [], xibId: c.xibId };
  }

  function layout(controls, width, parentId) {
    const rows = [];
    for (const c of stableSort(controls, byTopX)) {
      const r = rows[rows.length - 1];
      if (r) {
        const overlap = Math.min(r.bottom, c.top + c.h) - Math.max(r.top, c.top);
        if (overlap >= 0.5 * Math.min(c.h, r.minH)) {
          r.items.push(c); r.top = Math.min(r.top, c.top); r.bottom = Math.max(r.bottom, c.top + c.h); r.minH = Math.min(r.minH, c.h);
          continue;
        }
      }
      rows.push({ items: [c], top: c.top, bottom: c.top + c.h, minH: c.h });
    }
    const out = [];
    rows.forEach((r, i) => {
      const items = stableSort(r.items, (a, b) => a.x - b.x);
      if (items.length === 1) { out.push(widgetOf(items[0], width)); return; }
      const id = parentId + '-r' + (i + 1);
      if (items.every((c) => c.kind === 'button')) {
        out.push({ kind: 'container', id, props: { layout: items[0].x > width / 2 ? 'toolbar-end' : 'toolbar' }, children: items.map((c) => widgetOf(c, width)) });
        return;
      }
      out.push({ kind: 'container', id, props: { layout: 'row' }, children: items.map((c) => {
        const w = widgetOf(c, width);
        w.props.span = width > 0 ? Math.max(1, Math.min(12, halfUp(12 * c.w / width))) : 12;
        return w;
      }) });
    });
    return out;
  }

  function topView(doc, name) {
    const objects = kids(doc.documentElement).find((c) => c.tagName === 'objects');
    for (const el of kids(objects)) {
      if ((el.tagName === 'customView' || el.tagName === 'view') && (!name || is(el, 'identifier', name) || is(el, 'id', name))) return el;
      if (el.tagName === 'window' && !name) { const v = keyed(el, 'view', 'contentView'); if (v) return v; }
    }
    return null;
  }

  function treeFromDoc(doc, parentId) {
    const view = topView(doc, '');
    if (!view) return [];
    const [, , w, h] = frameOf(view);
    return layout(pairLabels(extractor().controls(view, h, 0, 0)), w, parentId || 'page');
  }

  function strip(tree) { return tree.map((w) => ({ kind: w.kind, id: w.id, props: w.props, children: strip(w.children) })); }

      row('Name (the view\'s Identifier)', text(attr(root, 'identifier') || '', (v) => root.setAttribute('identifier', v.trim())));
      const g = document.createElement('div'); g.className = 'grid4';
      for (const [lab, val, set] of [['Width', w, (v) => setFrame(root, 0, 0, v, frameOf(root)[3])], ['Height', h, (v) => shiftHeight(root, v)]]) {
        const i = document.createElement('input'); i.type = 'number'; i.value = val; i.title = lab;
        i.addEventListener('change', () => { snapshot(); set(Math.max(100, num(i.value))); redraw(); });
        g.appendChild(i);
      }
      row('Width, height', g);
      note('Click a control to change it. Drag to move, the corner to resize; arrow keys nudge (Shift: 10). Delete removes, Cmd/Ctrl+D duplicates, Cmd/Ctrl+Z undoes.');
      note('Controls side by side become a row on the web; a label just left of or above a field becomes its label.');
      return;
    }
    const el = selected, cell = cellOf(el), k = kindOf(el);
    h2(k === 'group' ? 'View' : k);
    const identOK = (v) => /^[A-Za-z][A-Za-z0-9_-]*$/.test(v);
    const ident = text(attr(el, 'identifier') || '', (v) => {
      v = v.trim();
      if (!v) { el.removeAttribute('identifier'); return; }
      if (!identOK(v)) { setStatus('An Identifier starts with a letter: letters, digits, - and _ only.', true); return; }
      if (allIdentifiers(el).has(v)) { setStatus('Another control already has the Identifier ' + v + '.', true); return; }
      el.setAttribute('identifier', v); setStatus('');
    }, 'insIdent');
    row('Identifier (the widget id in FB)', ident);
    if (!attr(el, 'identifier') && !['text', 'heading', 'divider', 'group'].includes(k)) note(attr(el, 'tag') && attr(el, 'tag') !== '0' ? 'No Identifier: the web uses tag' + attr(el, 'tag') + '.' : 'Give it an Identifier so FB can find it.', !(attr(el, 'tag') && attr(el, 'tag') !== '0'));

    if (['text', 'heading', 'button', 'checkbox'].includes(k)) row(k === 'checkbox' ? 'Label' : 'Text', text(attr(cell, 'title') || '', (v) => cell.setAttribute('title', v)));
    if (k === 'heading' || k === 'text') {
      const s = document.createElement('select');
      for (const [v, t] of [['', 'Body text'], ['muted', 'Muted text'], ['largeTitle', 'Heading 1'], ['title1', 'Heading 2'], ['title3', 'Heading 3'], ['headline', 'Heading 4']]) { const o = document.createElement('option'); o.value = v; o.textContent = t; s.appendChild(o); }
      const font = keyed(cell, 'font', 'font'), color = keyed(cell, 'color', 'textColor');
      s.value = attr(font, 'textStyle') && HEADING_STYLES[attr(font, 'textStyle')] ? attr(font, 'textStyle') : (is(color, 'name', 'secondaryLabelColor') ? 'muted' : '');
      s.addEventListener('change', () => {
        snapshot();
        if (font) { font.removeAttribute('metaFont'); font.removeAttribute('textStyle'); font.removeAttribute('usesAppearanceFont'); }
        if (HEADING_STYLES[s.value]) font.setAttribute('textStyle', s.value); else font.setAttribute('usesAppearanceFont', 'YES');
        if (color) color.setAttribute('name', s.value === 'muted' ? 'secondaryLabelColor' : 'labelColor');
        redraw();
      });
      row('Style', s);
    }
    if (k === 'field' && el.tagName !== 'datePicker') row('Placeholder', text(attr(cell, 'placeholderString') || '', (v) => (v ? cell.setAttribute('placeholderString', v) : cell.removeAttribute('placeholderString'))));
    if (k === 'button') check('Default button (Return)', !!keyed(cell, 'string', 'keyEquivalent') && keyed(cell, 'string', 'keyEquivalent').textContent.trim() === 'DQ', (on) => {
      const k2 = keyed(cell, 'string', 'keyEquivalent');
      if (k2) cell.removeChild(k2);
      if (on) { const s = doc.createElement('string'); s.setAttribute('key', 'keyEquivalent'); s.setAttribute('base64-UTF8', 'YES'); s.textContent = '\nDQ\n'; cell.appendChild(s); }
    });
    if (k === 'select') {
      const lines = descendants(el, 'menuItem').map((m) => (attr(m, 'tag') && attr(m, 'tag') !== '0' ? attr(m, 'tag') + '=' : '') + (attr(m, 'title') || '')).join('\n');
      row('Items, one per line (code=Title, or Title)', area(lines, (v) => {
        const menu = descendants(el, 'menu')[0];
        let items = kids(menu).find((c) => c.tagName === 'items');
        if (!items) { items = doc.createElement('items'); menu.appendChild(items); }
        while (items.firstChild) items.removeChild(items.firstChild);
        for (const line of v.split('\n').map((s) => s.trim()).filter(Boolean)) {
          const m = doc.createElement('menuItem'); const eq = line.indexOf('=');
          const code = eq > 0 ? line.slice(0, eq).trim() : '', title = eq > 0 ? line.slice(eq + 1).trim() : line;
          m.setAttribute('title', title); if (/^-?\d+$/.test(code) && code !== '0') m.setAttribute('tag', code); m.setAttribute('id', newId());
          items.appendChild(m);
        }
      }));
      if (descendants(el, 'menuItem').some((m) => attr(m, 'tag') === null)) note('Items without a numeric code send their title as the value.');
    }
    if (k === 'radio' && el.tagName !== 'button') {
      row('Choices, one per line', area(subviewsOf(el).map((b) => attr(cellOf(b), 'title') || '').join('\n'), (v) => {
        const sv = subviewsElement(el); while (sv.firstChild) sv.removeChild(sv.firstChild);
        const titles = v.split('\n').map((s) => s.trim()).filter(Boolean);
        const [, , w, h] = frameOf(el); let x = 0;
        for (const t of titles) { const b = fromTemplate(radioXML(t.replace(/"/g, '&quot;').replace(/</g, '&lt;')), 0, 0); const bw = Math.max(60, 14 + t.length * 8); setFrame(b, x, 0, bw, 18); x += bw; sv.appendChild(b); }
        setFrame(el, frameOf(el)[0], frameOf(el)[1], Math.max(w, x), h);
      }));
    }
    if (k === 'table') {
      const lines = descendants(el, 'tableColumn').map((c) => attr(c, 'identifier') + ': ' + (attr(keyed(c, 'tableHeaderCell', 'headerCell'), 'title') || '')).join('\n');
      row('Columns, one per line (Attribute: Title)', area(lines, (v) => {
        const cols = descendants(el, 'tableColumns')[0];
        while (cols.firstChild) cols.removeChild(cols.firstChild);
        for (const line of v.split('\n').map((s) => s.trim()).filter(Boolean)) {
          const i = line.indexOf(':'); const key = (i > 0 ? line.slice(0, i) : line).trim(), title = (i > 0 ? line.slice(i + 1) : line).trim();
          cols.appendChild(fromTemplate(columnXML(key.replace(/"/g, ''), title.replace(/"/g, '&quot;').replace(/</g, '&lt;')), 0, 0));
        }
      }));
      note('The table\'s Identifier is set on the table view inside the scroll view, as Interface Builder does.');
    }
    if (k === 'box') {
      row('Title', text(attr(el, 'title') || '', (v) => el.setAttribute('title', v)));
      note('Select the box, then add controls: they go inside it. A box with inputs is a form on the web.');
    }
    if (k === 'image') row('Image name', text(attr(cell, 'image') || '', (v) => cell.setAttribute('image', v)));
    const [x, y, w, h] = frameOf(el);
    const g = document.createElement('div'); g.className = 'grid4';
    for (const [lab, val, i] of [['X', x, 0], ['Y', y, 1], ['W', w, 2], ['H', h, 3]]) {
      const input = document.createElement('input'); input.type = 'number'; input.value = val; input.title = lab + (lab === 'Y' ? ' (from the bottom, as in the XIB)' : '');
      input.addEventListener('change', () => { snapshot(); const f = frameOf(el); f[i] = num(input.value); setFrame(el, ...f); redraw(); });
      g.appendChild(input);
    }
    row('X, Y, W, H', g);
    if (!['text', 'heading', 'divider', 'group'].includes(k)) check('Hidden at first', is(el, 'hidden', 'YES'), (on) => (on ? el.setAttribute('hidden', 'YES') : el.removeAttribute('hidden')));
    if (['field', 'textarea', 'button', 'checkbox', 'select'].includes(k) && cell) check('Disabled', is(cell, 'enabled', 'NO'), (on) => (on ? cell.setAttribute('enabled', 'NO') : cell.removeAttribute('enabled')));
    const del = document.createElement('button'); del.textContent = 'Remove'; del.style.marginTop = '12px';
    del.addEventListener('click', () => { snapshot(); el.parentNode.removeChild(el); selected = null; redraw(); });
    ins.appendChild(del);
  }

  // a new height keeps the controls where they are on screen (XIB y is measured from the bottom)
  function shiftHeight(root, newH) {
    const [, , w, h] = frameOf(root);
    for (const el of subviewsOf(root)) { const f = frameOf(el); setFrame(el, f[0], f[1] + (newH - h), f[2], f[3]); }
    setFrame(root, 0, 0, w, newH);
  }

  // ================= the web preview =================

  function esc(v) { return String(v === undefined || v === null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function renderWidget(w) {
    const p = w.props, id = esc(w.id);
    const common = ' data-fb-id="' + id + '" id="fb-' + id + '"' + (p.visible === false ? ' hidden' : '') + (p.span ? ' data-fb-span="' + p.span + '"' : '');
    const dis = p.enabled === false ? ' disabled' : '';
    const lab = p.label ? '<label class="form-label" for="fb-in-' + id + '">' + esc(p.label) + '</label>' : '';
    const kids = () => w.children.map(renderWidget).join('');
    switch (w.kind) {
      case 'container': { const tag = p.layout === 'form' ? 'form' : 'div'; return '<' + tag + ' class="fb-container fb-' + esc(p.layout) + '"' + common + '>' + kids() + '</' + tag + '>'; }
      case 'heading': return '<h' + p.level + ' class="fb-heading"' + common + '>' + esc(p.text) + '</h' + p.level + '>';
      case 'text': return '<p class="fb-text fb-' + esc(p.look) + '"' + common + '>' + esc(p.text) + '</p>';
      case 'divider': return '<hr class="fb-divider"' + common + '>';
      case 'message': return '<div class="alert alert-' + esc(p.role) + '" role="status"' + common + '>A message from FB appears here.</div>';
      case 'image': return '<img class="fb-image" src="' + esc(p.src) + '" alt=""' + common + '>';
      case 'button': return '<button type="button" class="btn btn-' + esc(p.role || 'secondary') + '"' + common + dis + '>' + esc(p.text) + '</button>';
      case 'field': return '<div class="mb-3 fb-field"' + common + '>' + lab + '<input class="' + (p.type === 'range' ? 'form-range' : 'form-control') + '" type="' + esc(p.type) + '" id="fb-in-' + id + '" placeholder="' + esc(p.placeholder) + '"' + dis + '></div>';
      case 'textarea': return '<div class="mb-3 fb-field"' + common + '>' + lab + '<textarea class="form-control" id="fb-in-' + id + '" rows="' + p.lines + '"' + dis + '></textarea></div>';
      case 'checkbox': return '<div class="form-check mb-3 fb-check"' + common + '><input class="form-check-input" type="checkbox" id="fb-in-' + id + '"' + dis + '><label class="form-check-label" for="fb-in-' + id + '">' + esc(p.label) + '</label></div>';
      case 'radio': return '<fieldset class="mb-3 fb-radio"' + common + '><legend class="form-label">' + esc(p.label) + '</legend>' + p.options.map((o, i) => '<div class="form-check"><input class="form-check-input" type="radio" name="fb-in-' + id + '" id="fb-in-' + id + '-' + i + '"><label class="form-check-label" for="fb-in-' + id + '-' + i + '">' + esc(o.title) + '</label></div>').join('') + '</fieldset>';
      case 'select': return '<div class="mb-3 fb-field"' + common + '>' + lab + '<select class="form-select" id="fb-in-' + id + '"' + dis + '>' + p.options.map((o) => '<option>' + esc(o.title) + '</option>').join('') + '</select></div>';
      case 'table': return '<div class="table-responsive fb-table"' + common + '><table class="table table-hover"><thead><tr>' + p.columns.map((c) => '<th' + (c.align === 'end' ? ' class="text-end"' : '') + '>' + esc(c.title) + '</th>').join('') + '</tr></thead><tbody><tr class="fb-empty"><td colspan="' + p.columns.length + '">Rows from FB.</td></tr></tbody></table></div>';
    }
    return '';
  }
  function preview() {
    const tree = treeFromDoc(doc, 'page');
    const theme = $('themeSel').value;
    const css = new URL('../Resources/web.css', location.href).href;
    $('frame').srcdoc = '<!doctype html><html lang="en"' + (theme ? ' data-fb-theme="' + theme + '"' : '') + '><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="' + css + '"></head><body><main class="fb-page container" data-fb-id="page">' + tree.map(renderWidget).join('') + '</main></body></html>';
    $('frame').style.maxWidth = $('phoneBtn').getAttribute('aria-pressed') === 'true' ? '390px' : '100%';
  }
  function showTab(web) {
    $('designTab').setAttribute('aria-pressed', String(!web)); $('webTab').setAttribute('aria-pressed', String(web));
    $('design').style.display = web ? 'none' : ''; $('preview').style.display = web ? 'flex' : 'none';
    if (web) preview();
  }
  $('designTab').addEventListener('click', () => showTab(false));
  $('webTab').addEventListener('click', () => showTab(true));
  $('wideBtn').addEventListener('click', () => { $('wideBtn').setAttribute('aria-pressed', 'true'); $('phoneBtn').setAttribute('aria-pressed', 'false'); preview(); });
  $('phoneBtn').addEventListener('click', () => { $('phoneBtn').setAttribute('aria-pressed', 'true'); $('wideBtn').setAttribute('aria-pressed', 'false'); preview(); });
  $('themeSel').addEventListener('change', preview);

  // ================= FB code =================

  function baseName() { return docName.replace(/\.(web)?xib$/i, '').replace(/[^A-Za-z0-9 _-]/g, '') || 'Layout'; }
  function fbCode() {
    const name = baseName(), tree = treeFromDoc(doc, 'page'), all = [];
    const walk = (ws) => { for (const w of ws) { all.push(w); walk(w.children); } };
    walk(tree);
    const fnName = (id) => id.replace(/[^A-Za-z0-9]/g, ' ').replace(/(?:^|\s)(\w)/g, (m, c) => c.toUpperCase()).replace(/\s/g, '');
    const lines = [];
    const handlers = [];
    for (const w of all) {
      if (w.kind === 'button') handlers.push([w.id, 'clicked', fnName(w.id) + 'Clicked']);
      if (w.kind === 'table') handlers.push([w.id, 'selected', fnName(w.id) + 'Selected']);
      if (w.kind === 'container' && w.props.layout === 'form') handlers.push([w.id, 'submitted', fnName(w.id) + 'Submitted']);
    }
    for (const [id, ev, fn] of handlers) {
      lines.push('void local fn ' + fn + '( session as WebSessionRef, widgetId as CFStringRef, eventValue as CFStringRef )');
      lines.push('// the ' + ev + ' event of ' + id);
      lines.push('end fn', '', '');
    }
    lines.push('void local fn BuildPage( session as WebSessionRef )');
    lines.push('fn WebLoadLayout( session, @"page", @"' + name + '" )      // ' + name + '.webxib');
    for (const [id, ev, fn] of handlers) lines.push('fn WebOn( session, @"' + id + '", @"' + ev + '", @fn ' + fn + ' )');
    const forms = all.filter((w) => w.kind === 'container' && w.props.layout === 'form');
    for (const f of forms) {
      lines.push('// bound to an entity (Web Binding.incl): fn WebFormBind( session, @"' + f.id + '", @"Entity", @"" )');
      const walkForm = (ws) => { for (const w of ws) { if (['field', 'textarea', 'select', 'radio', 'checkbox'].includes(w.kind)) lines.push('//     fn WebBindField( session, @"' + f.id + '", @"' + w.id + '", @"Attribute" )'); walkForm(w.children); } };
      walkForm(f.children);
    }
    lines.push('end fn');
    return lines.join('\n');
  }
  $('codeBtn').addEventListener('click', () => {
    $('codeFile').textContent = baseName() + '.webxib';
    $('code').value = fbCode();
    $('codeDialog').style.display = 'flex';
  });
  $('closeCode').addEventListener('click', () => { $('codeDialog').style.display = 'none'; });
  $('copyCode').addEventListener('click', () => { $('code').select(); try { navigator.clipboard.writeText($('code').value); } catch (e) { document.execCommand('copy'); } });

  // ================= files =================

  function save(extension) {
    const blob = new Blob([serialize()], { type: 'application/xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = baseName() + extension;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    dirty = false;
    setStatus('Saved ' + a.download + (extension === '.webxib' ? ': add it to the web app\'s Resources.' : ': open it in Interface Builder, or add it to a desktop app.'));
  }
  $('saveXibBtn').addEventListener('click', () => save('.xib'));
  $('saveWebBtn').addEventListener('click', () => save('.webxib'));
  $('openBtn').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', () => { const f = $('fileInput').files[0]; if (f) f.text().then((t) => load(t, f.name)); $('fileInput').value = ''; });
  $('newBtn').addEventListener('click', () => { if (!dirty || confirm('Start a new layout? Changes not saved are lost.')) load(BLANK, 'Untitled'); });
  $('undoBtn').addEventListener('click', undo);
  const stage = $('stage');
  stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('drop'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('drop'));
  stage.addEventListener('drop', (e) => { e.preventDefault(); stage.classList.remove('drop'); const f = e.dataTransfer.files[0]; if (f) f.text().then((t) => load(t, f.name)); });
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // for the tests and for App Builder: open a XIB's text, read the document back
  window.fbLayoutOpen = (xml, name) => load(xml, name);
  window.fbLayoutText = () => serialize();

  load(BLANK, 'Untitled');
})();
</script>
</body>
</html>
