# FastCGI Test nginx.conf - nginx in front of src/MacTests/FastCGI Test.fb
#
# A complete nginx configuration, run from this folder (no Homebrew servers/ folder, no default site on 8080):
#     brew install nginx
#     cd src/MacTests
#     nginx -c "$PWD/FastCGI Test nginx.conf" -p "$PWD"        (stop it: nginx -s stop -c "$PWD/FastCGI Test nginx.conf" -p "$PWD")
# then run FastCGI Test.fb. The browser goes to http://127.0.0.1:8088/.
# nginx answers the browser; every request goes on to the FutureBasic program on 127.0.0.1:9010 (FastCGI).
# 9010, not 9000: PHP-FPM, common on a Mac with Homebrew PHP, holds 9000.

worker_processes 1;
error_log nginx-error.log;
pid nginx.pid;
events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;
    client_max_body_size 1m;

    server {
        listen 127.0.0.1:8088;

        location / {
            include fastcgi_params;              # REQUEST_METHOD, DOCUMENT_URI, QUERY_STRING, HTTP_COOKIE, ...
            fastcgi_pass 127.0.0.1:9010;         # the FutureBasic program
            fastcgi_read_timeout 30s;
        }
    }
}
