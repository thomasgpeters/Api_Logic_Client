# FastCGI Test nginx.conf - nginx in front of src/MacTests/FastCGI Test.fb
#
# Homebrew on a Mac: brew install nginx, then copy this file to $(brew --prefix)/etc/nginx/servers/ (mkdir -p it if missing),
# then:  brew services restart nginx   - and run FastCGI Test.fb. The browser goes to http://127.0.0.1:8088/.
# nginx answers the browser; every request goes on to the FutureBasic program on 127.0.0.1:9000 (FastCGI).

server {
    listen 127.0.0.1:8088;
    server_name localhost;
    client_max_body_size 1m;

    location / {
        include fastcgi_params;                  # REQUEST_METHOD, DOCUMENT_URI, QUERY_STRING, HTTP_COOKIE, ...
        fastcgi_pass 127.0.0.1:9000;             # the FutureBasic program
        fastcgi_read_timeout 30s;
    }
}
